<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="掃除チェック">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" id="touch-icon" href="icon-180.png?v=640">
<link rel="icon" type="image/png" href="icon-192.png">
<title>町田商店本巣店 掃除チェック</title>
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F2F2F5; --line:#DEDEE4; --text:#111114; --muted:#6B6B76;
  --red:#E4262C; --green:#1E9E3A; --green-deep:#DDF5DF; --ok-text:#146C22; --amber:#F5C518;
  --inv:#111114; --inv-text:#FFFFFF; --soft:#F1F1F4; --softer:#E4E4EA; --disabled:#C4C4CC; --dash:#C9C9D1; --ph:#9A9AA3;
  --danger-text:#C8141B; --caution-bg:#FDECEC; --caution-text:#B81C22; --wip-bg:#FFF7D6; --flash:#E3F6E5;
  --sun:#D0262C; --sat:#2563EB; --topbar:rgba(255,255,255,.96); --overlay:rgba(0,0,0,.45); --done-day:#FFFFFF; --chev:#B5B5BF;
  --zoom:1;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0B0B0D; --panel:#17171A; --panel-2:#202024; --line:#2F2F36; --text:#FFFFFF; --muted:#A9A9B3;
  --green:#5BD16A; --green-deep:#1F6B2B; --ok-text:#D6FFD9;
  --inv:#FFFFFF; --inv-text:#000000; --soft:#24242A; --softer:#33333A; --disabled:#4A4A55; --dash:#4A4A55; --ph:#6B6B77;
  --danger-text:#FF6B6B; --caution-bg:#2A1416; --caution-text:#FF8D8D; --wip-bg:#2A2412; --flash:#1E3A1E;
  --sun:#FF8D8D; --sat:#8DB8FF; --topbar:rgba(11,11,13,.94); --overlay:rgba(0,0,0,.72); --done-day:#06210A; --chev:#5A5A66;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;zoom:var(--zoom);background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.65;
  -webkit-tap-highlight-color:transparent;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
img:not([src]){visibility:hidden}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 12px,#000 12px 24px)}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px}
.admin .topbar{padding-top:env(safe-area-inset-top)}
.admin .topbar-inner{padding-top:12px}
.topbar-inner.narrow{max-width:880px}
.brand{flex:1;min-width:0}
.app-title{font-weight:800;font-size:23px;letter-spacing:.02em;margin:0;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-title::before{content:"";display:inline-block;width:10px;height:22px;background:var(--red);border-radius:3px;margin-right:9px;vertical-align:-3px}
.today-line{font-size:13.5px;font-weight:600;color:var(--muted);margin-left:19px}
.spacer{flex:1}
.back{border:0;background:none;color:var(--text);font-weight:800;font-size:17px;min-height:48px;padding:0 10px 0 0;display:inline-flex;align-items:center;gap:4px}
.back svg{width:22px;height:22px}
.admin-tag{font-weight:800;font-size:13px;background:var(--amber);color:#000;padding:4px 10px;border-radius:6px;white-space:nowrap}
.lock-btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-weight:800;font-size:14px;white-space:nowrap}
.lock-btn svg{width:18px;height:18px}
.admin .lock-btn{background:var(--amber);color:#000;border-color:var(--amber)}

/* ---------- layout ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:14px 20px calc(120px + env(safe-area-inset-bottom))}
.wrap.narrow{max-width:880px}
.page-title{font-size:23px;font-weight:800;margin:2px 0 14px;line-height:1.35}
.panel{background:var(--panel);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.notice{background:var(--panel);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:15px;display:flex;gap:12px;align-items:flex-start;border-left:6px solid var(--amber)}
.notice.soft{border-left-color:var(--line)}
.notice p{margin:4px 0 0;color:var(--muted)}
.notice .x{margin-left:auto;flex:none}
.admin-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}

/* ---------- chips ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;min-width:48px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-weight:800;font-size:15px}
.chip[aria-pressed="true"]{background:var(--inv);color:var(--inv-text);border-color:var(--inv)}
.chip.todo{margin-left:auto}
.chip.todo[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#000}
.wrap-chips{flex-wrap:wrap;overflow:visible}

/* ---------- checklist ---------- */
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px 18px 12px;flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:21px;font-weight:800;line-height:1.3}
.sheet-due{font-size:13px;font-weight:800;color:#000;background:var(--amber);border-radius:6px;padding:2px 9px}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.prog b{font-size:20px;color:var(--text)}
.bar{width:90px;height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.cols,.row{display:grid;grid-template-columns:54px 1fr 132px 108px}
.cols{background:var(--panel-2);font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.cols span{padding:7px 12px}
.cols span:first-child,.cols span:nth-child(3),.cols span:last-child{text-align:center}
.rows{list-style:none;margin:0;padding:0}
.row{border-top:1px solid var(--line);min-height:64px;align-items:stretch}
.pcell{display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--muted);border-right:1px solid var(--line);padding:0 4px;text-align:center;line-height:1.2}
.name{border:0;background:none;color:var(--text);text-align:left;padding:10px 14px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.name span{flex:1;min-width:0}
.name svg{flex:none;width:18px;height:18px;color:var(--chev)}
.name:active{background:var(--panel-2)}
.row-memo{display:block;font-size:13px;font-weight:700;color:var(--amber);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{border:0;background:none;color:var(--text);padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.3}
.date:active{background:var(--panel-2)}
.date .d{font-size:17px;font-weight:800;display:flex;align-items:center;gap:5px}
.date .d svg{width:15px;height:15px;color:var(--green)}
.date .s{font-size:13px;font-weight:700;color:var(--muted)}
.st-ok .date .d{color:var(--green)}
.st-todo .date .d,.st-wip .date .d{font-size:14px;color:var(--muted);border:1px dashed var(--dash);border-radius:10px;padding:5px 12px}
.wip-tag{font-size:13px;font-weight:800;background:var(--amber);color:#000;border-radius:6px;padding:3px 10px}
.limit{border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 6px;line-height:1.3}
.limit .d{font-size:15px;font-weight:800}
.limit .s{font-size:12.5px;font-weight:700;color:var(--muted)}
.limit.soon .d,.limit.soon .s{color:var(--red)}
.limit.done .d{color:var(--green)}
.row.flash{animation:flash 1.2s ease}
.empty{text-align:center;padding:36px 20px}
.empty.small{padding:18px 20px 22px;color:var(--muted)}
.empty h2{font-size:19px;margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted)}
.empty.small p{margin:0}

/* ---------- buttons ---------- */
.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:800;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.light{background:var(--inv);border-color:var(--inv);color:var(--inv-text)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--danger-text);color:var(--danger-text);background:transparent}
.btn.small{min-height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);display:inline-grid;place-items:center;font-weight:800;font-size:18px;padding:0}
.icon-btn:disabled{opacity:.3}

/* ---------- detail ---------- */
.detail-head{padding:20px 22px 14px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{font-size:13px;font-weight:800;padding:3px 10px;border-radius:6px;background:var(--panel-2);color:var(--muted)}
.pill.p{background:var(--red);color:#fff}
.detail-title{font-size:27px;font-weight:800;line-height:1.35;margin:0}
.done-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 22px 12px;padding:14px 16px;border-radius:12px;background:var(--panel-2)}
.done-box .t{flex:1;min-width:190px}
.done-box .t small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.done-box .t b{font-size:22px}
.done-box .t b.muted{font-size:18px;color:var(--muted)}
.done-box .nm{font-weight:800;font-size:17px;color:var(--muted)}
.done-box .st{font-size:13px;font-weight:800;margin-left:8px;padding:2px 9px;border-radius:6px;vertical-align:3px}
.done-box .st.ok{background:var(--green-deep);color:var(--ok-text)}
.done-box .st.wip{background:var(--amber);color:#000}
.done-box .st.todo{background:var(--panel);color:var(--muted)}
.memo-box{display:flex;align-items:center;gap:14px;margin:0 22px 14px;padding:12px 16px;border-radius:12px;border:1px solid var(--amber)}
.memo-box.empty{border-style:dashed;border-color:var(--line);padding:12px 16px;text-align:left}
.memo-box .t{flex:1;min-width:0}
.memo-box small{display:block;font-size:13px;font-weight:800;color:var(--amber)}
.memo-box.empty small{color:var(--muted)}
.memo-box p{margin:2px 0 0;font-size:17px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.memo-box p.none{font-size:15px;font-weight:600;color:var(--muted)}
.memo-box .by{font-size:13px;color:var(--muted);font-weight:700}
.memo-box .btn{flex:none}
.memo-box .wip-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--amber);color:#000;font-size:12px}
.help-entry{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:0 0 14px;padding:12px 16px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);text-align:left}
.help-entry svg{width:26px;height:26px;color:var(--red);flex:none}
.help-entry .t{flex:1;min-width:0}
.help-entry .t b{display:block;font-size:16px}
.help-entry .t small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.help-entry .chev{color:var(--chev)}
.help-list{display:flex;flex-direction:column;gap:12px}
.help-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.help-card video{display:block;width:100%;max-height:70vh;background:#000}
.help-card .cap{padding:12px 16px;display:flex;align-items:center;gap:10px}
.help-card .cap .t{flex:1;min-width:0}
.help-card .cap b{display:block;font-size:15px;overflow-wrap:anywhere}
.help-card .cap small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.help-empty{text-align:center;padding:48px 20px;color:var(--muted);border:1px dashed var(--dash);border-radius:14px}
.help-empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.help-edit-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.help-edit-row .thumb{width:64px;height:64px;border-radius:10px;background:var(--panel-2) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.help-edit-row .thumb svg{width:24px;height:24px}
.help-edit-row .f{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.help-edit-row input.input{margin:0}
.help-edit-row .mv{display:flex;flex-direction:column;gap:4px}
.help-edit-row .mv button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text)}
.help-edit-row .mv button svg{width:16px;height:16px}
.url-box{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.url-box .lbl{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px}
.url-link{display:inline-block;font-size:16px;font-weight:700;color:var(--red);word-break:break-all;text-decoration:underline}
.url-box .hint{margin:8px 0 0}
.reset-freq-block{margin-bottom:4px}
.reset-sep{border:none;border-top:1px solid var(--line);margin:18px 0}
.date-grid{gap:6px}
.chip.sm{min-width:38px;min-height:38px;padding:0;text-align:center;font-size:13px}
.icon-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.icon-prev{width:84px;height:84px;border-radius:19px;border:1px solid var(--line);background:#fff;object-fit:cover;flex:none}
.icon-prev.big{width:132px;height:132px;border-radius:29px;display:block;margin:6px auto 14px}
.steps-list{margin:10px 0 0;padding-left:1.4em;font-size:15px;line-height:1.7;color:var(--muted)}
.steps-list b{color:var(--text)}
.history{margin:0 22px 18px;font-size:15px}
.history summary{cursor:pointer;font-weight:800;color:var(--muted);padding:6px 0;min-height:40px;display:flex;align-items:center;list-style:none}
.history summary::-webkit-details-marker{display:none}
.history summary::after{content:"▾";margin-left:6px}
.history[open] summary::after{content:"▴"}
.history ul{list-style:none;margin:4px 0 0;padding:0}
.history li{display:flex;gap:14px;padding:8px 0;border-top:1px solid var(--line)}
.history li b{min-width:170px;font-weight:800}
.history li span{color:var(--muted);font-weight:700}
.howto-title{font-size:18px;font-weight:800;margin:0;padding:16px 22px 0;border-top:1px solid var(--line)}
.howto-empty{margin:12px 22px 24px;padding:26px 16px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
.howto-empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 22px 4px}
.info-row.one{grid-template-columns:1fr}
.info{border-radius:12px;padding:12px 16px;background:var(--panel-2);font-size:16px}
.info.caution{background:var(--caution-bg);border-left:5px solid var(--red)}
.info h3{font-size:15px;font-weight:800;margin:0 0 2px}
.info.caution h3{color:var(--caution-text)}
.info p{margin:0;white-space:pre-wrap}
.steps{list-style:none;margin:0;padding:4px 22px 22px}
.step{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-top:1px dashed var(--line)}
.step:first-child{border-top:0}
.step-num{width:50px;height:50px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:23px;line-height:1}
.step-num.sm{width:34px;height:34px;font-size:16px}
.step-text{font-size:19px;line-height:1.8;white-space:pre-wrap;margin:9px 0 0;overflow-wrap:anywhere}
.step-media{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:14px}
.img-btn{border:0;padding:0;background:var(--panel-2);border-radius:10px;overflow:hidden;display:block;width:100%}
.img-btn img{width:100%;display:block;max-height:60vh;object-fit:contain}
.vid-wrap{position:relative}
.step-media video{width:100%;display:block;border-radius:10px;background:#000;max-height:70vh}
.vid-load{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.8);color:#fff;font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px}

/* ---------- forms ---------- */
.form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.field{margin-bottom:20px}
.field:last-child{margin-bottom:0}
.lbl{display:block;font-weight:800;margin-bottom:6px;font-size:16px}
.lbl small,.lbl-sm{font-weight:600;color:var(--muted);margin-left:6px;font-size:13px}
.lbl-sm{display:block;margin:12px 0 0}
.hint{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.set-title{font-size:18px;font-weight:800;margin:0 0 6px}
.set-text{margin:0 0 12px;color:var(--muted);font-size:15px}
.section-title{font-size:20px;font-weight:800;margin:22px 0 10px}
.input,.textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--text);-webkit-appearance:none;appearance:none}
.input::placeholder,.textarea::placeholder{color:var(--ph)}
.input:focus,.textarea:focus{outline:none;border-color:var(--inv)}
.textarea{min-height:92px;resize:vertical;line-height:1.6}
.row-f{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-f .input{flex:1;min-width:190px}
.step-edit{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.step-edit-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.step-edit-head .grow{flex:1;font-weight:800}
.media-edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.m-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel-2)}
.m-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m-thumb .x{position:absolute;top:5px;right:5px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.8);color:#fff;border:0;font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.m-thumb .kind{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px}
.m-thumb .vid-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:var(--muted)}
.file-label{position:relative;overflow:hidden}
.file-label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.add-media,.add-step{border-style:dashed}
.danger-zone{margin-top:24px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--topbar);border-top:1px solid var(--line);padding:12px calc(20px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.savebar-inner{max-width:880px;margin:0 auto;display:flex;gap:12px;justify-content:flex-start;padding-right:170px}
.savebar .btn{min-width:130px}

/* =========================================================
   日付（端末の時刻。"YYYY-MM-DD" で保存）
   ========================================================= */
const WD = '日月火水木金土';
const pad = n => String(n).padStart(2, '0');
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => toKey(new Date());
const fmtMD = k => { const d = fromKey(k); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const fmtYMD = k => { const d = fromKey(k); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]})`; };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); };
const diffDays = (a, b) => { const x = fromKey(a), y = fromKey(b); return Math.round((Date.UTC(y.getFullYear(), y.getMonth(), y.getDate()) - Date.UTC(x.getFullYear(), x.getMonth(), x.getDate())) / 86400000); };
const daysAgo = k => diffDays(k, todayKey());
const agoLabel = k => { const n = daysAgo(k); return n <= 0 ? '今日' : n === 1 ? '昨日' : `${n}日前`; };

/* ---- リセット日の計算 ---- */
// その月の「第n ○曜日」
function nthWeekday(y, m, weekday, n){
  const first = new Date(y, m, 1);
  const day = 1 + ((weekday - first.getDay() + 7) % 7) + (n - 1) * 7;
  const last = new Date(y, m + 1, 0).getDate();
  return day > last ? null : toKey(new Date(y, m, day));
}
const resetModeOf = (cfg, freq) => (cfg.mode && cfg.mode[freq]) || 'weekday';
// その月にある日付（31日指定でも、その月になければ飛ばす）
function monthDates(y, m, days){
  const last = new Date(y, m + 1, 0).getDate();
  return (days || []).filter(d => d >= 1 && d <= last).map(d => toKey(new Date(y, m, d))).sort();
}
// 直近3か月ぶんのリセット日を並べる
function resetDates(freq, around){
  const base = fromKey(around || todayKey());
  const cfg = S.reset || DEFAULT_RESET;
  const wd = cfg.weekday ?? 6;
  const mode = resetModeOf(cfg, freq);
  const out = [];
  for (let off = -2; off <= 2; off++){
    const d = new Date(base.getFullYear(), base.getMonth() + off, 1);
    const y = d.getFullYear(), m = d.getMonth();
    if (mode === 'date'){
      const days = (cfg.dates && cfg.dates[freq]) || [];
      monthDates(y, m, days).forEach(k => out.push(k));
      continue;
    }
    if (freq === 'weekly'){
      for (let n = 1; n <= 5; n++){ const k = nthWeekday(y, m, wd, n); if (k) out.push(k); }
    } else if (freq === 'biweekly'){
      (cfg.biweekly || DEFAULT_RESET.biweekly).forEach(n => { const k = nthWeekday(y, m, wd, n); if (k) out.push(k); });
    } else {
      const k = nthWeekday(y, m, wd, cfg.monthly || DEFAULT_RESET.monthly); if (k) out.push(k);
    }
  }
  return [...new Set(out)].sort();
}
// day が入っている期間の開始日（リセット日そのものはその期間の初日）
function periodStart(freq, day){
  const d = day || todayKey();
  const list = resetDates(freq, d).filter(k => k <= d);
  return list.length ? list[list.length - 1] : d;
}
// 次のリセット日と、その前日（＝期限）
function nextReset(freq, day){
  const d = day || todayKey();
  const list = resetDates(freq, d).filter(k => k > d);
  return list.length ? list[0] : addDays(d, 7);
}
const dueKey = (freq, day) => addDays(nextReset(freq, day), -1);
function dueLabel(k){
  const n = diffDays(todayKey(), k);
  return n <= 0 ? '今日まで' : n === 1 ? '明日まで' : `あと${n}日`;
}
const FREQ_JP = { weekly: 'ウィークリー', biweekly: '2ウィーク', monthly: '月1' };
const resetLabel = () => {
  const cfg = S.reset || DEFAULT_RESET;
  const w = WD[cfg.weekday ?? 6];
  const nth = (cfg.biweekly || DEFAULT_RESET.biweekly).map(n => `第${n}`).join('・');
  const parts = FREQ_ORDER.map(f => {
    if (resetModeOf(cfg, f) === 'date'){
      const days = ((cfg.dates && cfg.dates[f]) || []).slice().sort((a, b) => a - b);
      return `${FREQ_JP[f]}＝${days.length ? days.map(d => `${d}日`).join('・') : '未設定'}`;
    }
    if (f === 'weekly') return `${FREQ_JP[f]}＝毎週${w}曜`;
    if (f === 'biweekly') return `${FREQ_JP[f]}＝${nth}${w}曜`;
    return `${FREQ_JP[f]}＝第${cfg.monthly || 1}${w}曜`;
  });
  return parts.join('／');
};

/* ---- 項目の状態 ---- */

const freqOf = it => it.freq || 'weekly';
// 今の期間に記録があるか
function doneThisPeriod(it){
  const from = periodStart(freqOf(it));
  return (it.done || []).find(d => d >= from) || null;
}

function status(it){

}
/* =========================================================
   Storage (IndexedDB, falls back to memory for previews)
   ========================================================= */
let db = null;
let memoryMode = false;
const mem = { items: new Map(), media: new Map(), settings: new Map(), help: new Map(), photos: new Map() };

function openDB(){
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window) || !window.indexedDB) return reject(new Error('no indexedDB'));
    let req;
    try { req = indexedDB.open('seisou-local', 3); } catch (e) { return reject(e); }
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('help')) d.createObjectStore('help', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
      // v6.4：ビフォー・アフター写真（リセットで自動的に消える）
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function run(stores, mode, fn){
  return new Promise((resolve, reject) => {
    let t;
    try { t = db.transaction(stores, mode); } catch (e) { reject(e); return; }
    const o = {};
    stores.forEach(n => o[n] = t.objectStore(n));
    try { fn(o); } catch (e) { try { t.abort(); } catch (_) {} reject(e); return; }
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('aborted'));
  });
}
const mediaIdsOf = item => (item.steps || []).flatMap(s => (s.media || []).map(m => m.id));

const Store = {
  async getAll(s){ return memoryMode ? [...mem[s].values()] : reqP(db.transaction(s).objectStore(s).getAll()); },
  async get(s, k){ return memoryMode ? mem[s].get(k) : reqP(db.transaction(s).objectStore(s).get(k)); },
  async put(s, v){
    if (memoryMode){ mem[s].set(v.id ?? v.key, v); return; }
    return run([s], 'readwrite', o => o[s].put(v));
  },
  async putMany(s, arr){
    if (memoryMode){ arr.forEach(v => mem[s].set(v.id ?? v.key, v)); return; }
    return run([s], 'readwrite', o => arr.forEach(v => o[s].put(v)));
  },
  async delete(s, k){
    if (memoryMode){ mem[s].delete(k); return; }
    return run([s], 'readwrite', o => o[s].delete(k));
  },
  async deleteMany(s, keys){
    if (!keys.length) return;
    if (memoryMode){ keys.forEach(k => mem[s].delete(k)); return; }
    return run([s], 'readwrite', o => keys.forEach(k => o[s].delete(k)));
  },
  async saveItem(item, add, del){
    if (memoryMode){ add.forEach(r => mem.media.set(r.id, r)); del.forEach(id => mem.media.delete(id)); mem.items.set(item.id, item); return; }
    return run(['items', 'media'], 'readwrite', o => { add.forEach(r => o.media.put(r)); del.forEach(id => o.media.delete(id)); o.items.put(item); });
  },
  async deleteItem(item){
    const ids = mediaIdsOf(item);
    if (memoryMode){ ids.forEach(id => mem.media.delete(id)); mem.items.delete(item.id); return; }
    return run(['items', 'media'], 'readwrite', o => { ids.forEach(id => o.media.delete(id)); o.items.delete(item.id); });
  },
  async replaceAll(items, media, help){
    if (memoryMode){
      mem.items.clear(); mem.media.clear(); mem.help.clear();
      items.forEach(i => mem.items.set(i.id, i)); media.forEach(m => mem.media.set(m.id, m));
      (help || []).forEach(h => mem.help.set(h.id, h));
      return;
    }
    return run(['items', 'media', 'help'], 'readwrite', o => {
      o.items.clear(); o.media.clear(); o.help.clear();
      items.forEach(i => o.items.put(i)); media.forEach(m => o.media.put(m));
      (help || []).forEach(h => o.help.put(h));
    });
  }
};

const urls = new Map();
function objURL(key, blob){ if (urls.has(key)) return urls.get(key); const u = URL.createObjectURL(blob); urls.set(key, u); return u; }
function revokeAll(){ urls.forEach(u => URL.revokeObjectURL(u)); urls.clear(); }

async function hydrate(root){

    }
  }));
}

function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function drawToBlob(source, w, h, max, q){
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(source, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(b), 'image/jpeg', q));
}
async function processImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const w = img.naturalWidth, h = img.naturalHeight;
    const full = await drawToBlob(img, w, h, 1600, 0.85);
    const thumb = await drawToBlob(img, w, h, 480, 0.8);
    if (!full) throw new Error('encode');
    return { kind: 'image', mime: 'image/jpeg', blob: full, thumb };
  } catch (_) {
    return { kind: 'image', mime: file.type || 'image/jpeg', blob: new Blob([file], { type: file.type }), thumb: null };
  } finally { URL.revokeObjectURL(url); }
}
function videoThumb(file){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    let done = false;
    const finish = b => { if (done) return; done = true; clearTimeout(timer); try { v.pause(); v.removeAttribute('src'); v.load(); } catch (_) {} URL.revokeObjectURL(url); resolve(b || null); };
    const timer = setTimeout(() => finish(null), 8000);
    v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 3); } catch (_) { finish(null); } };
    v.onseeked = async () => {
      try { if (!v.videoWidth) return finish(null); finish(await drawToBlob(v, v.videoWidth, v.videoHeight, 480, 0.8)); }
      catch (_) { finish(null); }
    };
    v.onerror = () => finish(null);
    v.src = url;
    const p = v.play && v.play();
    if (p && p.then) p.then(() => v.pause()).catch(() => {});
  });
}
async function processVideo(file){
  const thumb = await videoThumb(file);
  const mime = file.type || (/\.mov$/i.test(file.name) ? 'video/quicktime' : 'video/mp4');
  return { kind: 'video', mime, blob: new Blob([file], { type: mime }), thumb };
}

      <div class="keypad">${keys.map(k => k === 'cancel' ? `<button class="key ghost" data-k="cancel">やめる</button>`
        : k === 'del' ? `<button class="key ghost" data-k="del" aria-label="1文字消す">消す</button>`
        : `<button class="key" data-k="${k}">${k}</button>`).join('')}</div></div>`;
    const card = el.querySelector('.card');
    const dots = [...el.querySelectorAll('.pin-dots span')];
    const err = el.querySelector('.pin-err');
    const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < val.length));
    const close = r => { document.removeEventListener('keydown', onKey); el.remove(); resolve(r); };
    const press = async k => {
      if (k === 'cancel') return close(null);
      if (k === 'del'){ val = val.slice(0, -1); paint(); return; }
      if (val.length >= PIN_LEN) return;
      val += k; err.textContent = ''; paint();
      if (val.length === PIN_LEN){
        if (!validate) return setTimeout(() => close(val), 120);
        if (await validate(val)) return close(true);
        err.textContent = '番号が違います';
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        setTimeout(() => { val = ''; paint(); }, 300);
      }
    };
    const onKey = e => {
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Escape') press('cancel');
    };
    el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
    document.addEventListener('keydown', onKey);
    overlay.appendChild(el);
  });
}

function openLightbox(src, alt){

}

function parseRoute(){
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').filter(Boolean);
  if (parts[0] === 'item' && parts[1]) return { name: 'item', id: decodeURIComponent(parts[1]) };
  if (parts[0] === 'edit' && parts[1]) return { name: 'edit', id: decodeURIComponent(parts[1]) };
  if (parts[0] === 'new') return { name: 'new' };
  if (parts[0] === 'sort') return { name: 'sort' };
  if (parts[0] === 'settings') return { name: 'settings' };
  if (parts[0] === 'help' && parts[1] === 'edit') return { name: 'help-edit' };
  if (parts[0] === 'help') return { name: 'help' };
  return { name: 'home' };
}
let ignoreHash = false, lastHash = location.hash, homeScroll = 0;
function go(hash){
  if (parseRoute().name === 'home') homeScroll = window.scrollY;
  if (location.hash === hash) render(); else location.hash = hash;
}
async function onHash(){
  if (ignoreHash){ ignoreHash = false; return; }
  const r = parseRoute();
  const inEditor = r.name === 'edit' || r.name === 'new';
  if (S.draft && !inEditor){
    // 編集画面から離れたとき：内容は自動保存済みなので、そのまま編集を終える
    if (!S.draft.leaving){ await autosave(true); await commitSession(S.editSession); await loadItems(); }
    S.draft = null;
  }
  lastHash = location.hash;
  render();
  window.scrollTo(0, r.name === 'home' ? homeScroll : 0);
}
function render(){
  document.body.classList.toggle('editing', S.editMode);
  const r = parseRoute();
  if (['edit', 'new', 'sort'].includes(r.name) && !S.editMode){ location.replace('#/'); return; }
  if (r.name === 'settings' && !S.settingsOpen){ location.replace('#/'); return; }
  if (r.name !== 'settings') S.settingsOpen = false;
  if (r.name === 'help-edit' && !S.helpEditOpen){ location.replace('#/help'); return; }
  if (r.name !== 'help-edit') S.helpEditOpen = false;
  revokeAll();
  if (r.name === 'item') return renderDetail(r.id);
  if (r.name === 'edit' || r.name === 'new') return renderEditor(r.name === 'edit' ? r.id : null);
  if (r.name === 'sort') return renderSort();
  if (r.name === 'settings') return renderSettings();
  if (r.name === 'help') return renderHelp();
  if (r.name === 'help-edit') return renderHelpEdit();
  renderHome();
}

/* =========================================================
   カレンダー（完了日の記録）
   ========================================================= */
async function recordDay(it, day, names){
  const freq = freqOf(it);
  const from = periodStart(freq, day), to = nextReset(freq, day);
  // 同じ期間の記録は1つだけ。押し直したら日付が入れ替わる
  const replaced = (it.done || []).filter(d => d >= from && d < to);
  it.done = [...new Set([day, ...(it.done || []).filter(d => !replaced.includes(d))])].sort().reverse();
  it.who = { ...(it.who || {}) };
  replaced.forEach(d => { if (d !== day) delete it.who[d]; });
  if (names && names.length) it.who[day] = names; else delete it.who[day];
  if (it.memo && it.memo.wip) it.memo = { ...it.memo, wip: false };
  await saveItem(it);
  refreshAfterChange(it.id);
  return replaced.filter(d => d !== day);
}
async function removeDay(it, day){
  it.done = (it.done || []).filter(d => d !== day);
  it.who = { ...(it.who || {}) }; delete it.who[day];
  await saveItem(it);
  refreshAfterChange(it.id);
}

function openCalendar(id){
  const cur = () => S.items.find(x => x.id === id);
  if (!cur()) return;
  const view = new Date(); view.setDate(1);
  const el = document.createElement('div');
  el.className = 'modal-bg';
  let busy = false, chosen = [], pickerOpen = false, sel = todayKey(), info = null;
  const close = () => { document.removeEventListener('keydown', onKey); el.remove(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  const namesOf = (it, d) => ((it.who || {})[d] || []);
  const paint = () => {
    const it = cur(); if (!it) return close();
    const t = todayKey(), done = new Set(it.done || []), freq = freqOf(it);
    const from = periodStart(freq), to = nextReset(freq), due = addDays(to, -1);
    const y = view.getFullYear(), mo = view.getMonth();
    const now = new Date();
    const isThisMonth = y === now.getFullYear() && mo === now.getMonth();
    const first = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
    let cells = WD.split('').map((w, i) => `<span class="wd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</span>`).join('');
    for (let i = 0; i < first; i++) cells += '<span></span>';
    for (let d = 1; d <= days; d++){
      const k = `${y}-${pad(mo + 1)}-${pad(d)}`;
      const cls = ['day', k === t ? 'today' : '', done.has(k) ? 'done' : '', k === sel && !done.has(k) ? 'sel' : '', k === info ? 'info-on' : '', k >= from && k < to ? 'in-period' : ''].join(' ');
      const lbl = `${mo + 1}月${d}日${k === t ? '（今日）' : ''}${done.has(k) ? '、実施済み（' + (namesOf(it, k).join('・') || '名前なし') + '）' : ''}`;
      cells += `<button class="${cls}" data-c="day" data-k="${k}" aria-label="${esc(lbl)}" ${k > t ? 'disabled' : ''}>${d}</button>`;
    }
    const infoBox = info ? `<div class="cal-info"><div><b>${esc(fmtMD(info))} の実施</b><span>${esc(namesOf(it, info).join('・') || '名前なし')}</span></div>
      <button class="btn small danger" data-c="clear" data-k="${esc(info)}">この記録を取り消す</button></div>` : '';
    const regLabel = `${fmtMD(sel)}${chosen.length ? '・' + chosen.join('・') : ''} ${T('cal_register')}`;
    el.innerHTML = `<div class="card cal-card" role="dialog" aria-modal="true" aria-label="${esc(it.title)}の完了日">
      <h2>${esc(it.title)}</h2>
      <p class="cal-period">今回の期間：${esc(fmtMD(from))} 〜 ${esc(fmtMD(due))}</p>
      ${S.staff.length ? `<button class="who-btn${chosen.length ? ' picked' : ''}" data-c="toggle-who" aria-expanded="${pickerOpen}">${esc(chosen.length ? chosen.join('・') : T('cal_pick'))} ${pickerOpen ? '▴' : '▾'}</button>
      ${pickerOpen ? `<div class="who-chips" role="group" aria-label="やった人（複数選べます）">${S.staff.map(n => `<button class="chip who" data-c="who" data-v="${esc(n)}" aria-pressed="${chosen.includes(n)}">${esc(n)}</button>`).join('')}</div>` : ''}` : ''}
      <div class="cal-head"><button class="icon-btn" data-c="prev" aria-label="前の月">‹</button><b>${y}年${mo + 1}月</b><button class="icon-btn" data-c="next" aria-label="次の月" ${isThisMonth ? 'disabled' : ''}>›</button></div>
      <div class="cal-grid">${cells}</div>
      <p class="cal-legend"><span class="sw" aria-hidden="true"></span>${esc(T('cal_past'))}</p>
      ${infoBox}
      <button class="reg-btn" data-c="register">${esc(regLabel)}</button>
      <div class="actions"><button class="btn" data-c="close">閉じる</button></div></div>`;
  };
  el.addEventListener('click', async e => {
    if (e.target === el) return close();
    const b = e.target.closest('[data-c]');
    if (!b || b.disabled || busy) return;
    const c = b.dataset.c, it = cur();
    if (c === 'close') return close();
    if (c === 'prev'){ view.setMonth(view.getMonth() - 1); return paint(); }
    if (c === 'next'){ view.setMonth(view.getMonth() + 1); return paint(); }
    if (c === 'toggle-who'){ pickerOpen = !pickerOpen; return paint(); }
    if (c === 'who'){ const v = b.dataset.v; chosen = chosen.includes(v) ? chosen.filter(x => x !== v) : [...chosen, v]; return paint(); }
    if (!it) return close();
    if (c === 'day'){
      const k = b.dataset.k;
      if ((it.done || []).includes(k)) info = info === k ? null : k; // 過去の実施日：だれがやったか表示
      else { sel = k; info = null; }
      return paint();
    }
    if (c === 'clear'){
      busy = true; await removeDay(it, b.dataset.k); busy = false;
      toast(`${fmtMD(b.dataset.k)} の記録を取り消しました`); info = null; return paint();
    }
    if (c === 'register'){
      if (S.staff.length && !chosen.length){
        pickerOpen = true; paint();
        const g = el.querySelector('.who-btn'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
        return toast('やった人を選んでください');
      }
      busy = true;
      const replaced = await recordDay(it, sel, chosen);
      busy = false;
      close();
      toast(replaced.length ? `${fmtMD(replaced[0])} → ${fmtMD(sel)} に変えました` : `${fmtMD(sel)}${chosen.length ? '・' + chosen.join('・') : ''} で登録しました`);
    }
  });
  document.addEventListener('keydown', onKey);
  paint();
  overlay.appendChild(el);
}

/* =========================================================
   メモ（途中まで の印もここ）
   ========================================================= */
function openMemo(id, opts){
  const it = S.items.find(x => x.id === id); if (!it) return;
  const allowWip = !opts || opts.allowWip !== false;
  const cur = it.memo || {};
  let chosen = cur.who && S.staff.includes(cur.who) ? cur.who : null;
  let wip = !!cur.wip;
  const el = document.createElement('div');
  el.className = 'modal-bg';
  const paintWip = () => { el.querySelector('#wip-btn')?.setAttribute('aria-pressed', String(wip)); };
  el.innerHTML = `<div class="card memo-card" role="dialog" aria-modal="true" aria-label="${esc(it.title)}のメモ">
    <h2>メモ：${esc(it.title)}</h2><p>${allowWip ? '一覧にも表示されます。途中までのときや、次の人への連絡に。' : '一覧にも表示されます。次の人への連絡などに。'}</p>
    <label class="sr-only" for="memo-text">メモの内容</label>
    <textarea class="textarea" id="memo-text" maxlength="100" placeholder="例：上の棚だけ残り">${esc(cur.text || '')}</textarea>
    ${allowWip ? `<button class="wip-toggle" id="wip-btn" data-m="wip" aria-pressed="${wip}"><span class="box">${ICON.check}</span>まだ終わっていない（途中）</button>` : ''}
    ${S.staff.length ? `<p class="lbl-sm">書いた人</p><div class="who-chips left">${S.staff.map(n => `<button class="chip who" data-m="who" data-v="${esc(n)}" aria-pressed="${chosen === n}">${esc(n)}</button>`).join('')}</div>` : ''}
    <div class="actions">${cur.text || cur.wip ? '<button class="btn danger" data-m="del">消す</button>' : ''}<button class="btn" data-m="close">やめる</button><button class="btn primary" data-m="save">保存</button></div></div>`;
  el.addEventListener('click', async e => {
    if (e.target === el) return el.remove();
    const b = e.target.closest('[data-m]'); if (!b) return;
    const m = b.dataset.m;
    if (m === 'close') return el.remove();
    if (m === 'wip'){ wip = !wip; return paintWip(); }
    if (m === 'who'){ chosen = chosen === b.dataset.v ? null : b.dataset.v; el.querySelectorAll('.chip.who').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === chosen))); return; }
    const text = m === 'del' ? '' : $('#memo-text', el).value.trim();
    const on = m === 'del' ? false : wip;
    it.memo = (text || on) ? { text, who: chosen, at: todayKey(), wip: on } : null;
    await saveItem(it);
    el.remove();
    const r = parseRoute();
    if (r.name === 'item') rerenderKeepScroll(); else refreshAfterChange(it.id);
    toast(it.memo ? 'メモを保存しました' : 'メモを消しました');
  });
  overlay.appendChild(el);
  $('#memo-text', el).focus();
}

async function onHelpFiles(input){
  const files = [...(input.files || [])];

/* =========================================================
   ビフォー・アフター写真
   ・撮った期間（リセット〜リセット）ごとに保存
   ・残すのは「今回」と「前回」の2期間だけ。それより古いものは自動で消す（容量対策）
   ・バックアップには含めない（一時的な記録のため）
   ========================================================= */
const SLOT_JP = { before: 'ビフォー', after: 'アフター' };
function photoPeriods(it){
  const freq = freqOf(it);
  const cur = periodStart(freq);
  const prev = periodStart(freq, addDays(cur, -1));
  return { cur, prev, prevEnd: addDays(cur, -1), due: dueKey(freq) };
}
async function loadPhotos(){
  try { S.photos = await Store.getAll('photos'); } catch (_) { S.photos = []; }
}
// 前回より古い写真・消えた項目の写真を削除する
async function prunePhotos(){
  if (!S.photos.length) return 0;
  const byId = new Map(S.items.map(it => [it.id, it]));
  const drop = S.photos.filter(ph => {
    const it = byId.get(ph.itemId);
    if (!it) return true;
    return ph.period < photoPeriods(it).prev;
  }).map(ph => ph.id);
  if (!drop.length) return 0;
  try { await Store.deleteMany('photos', drop); } catch (_) { return 0; }
  const set = new Set(drop);
  S.photos = S.photos.filter(ph => !set.has(ph.id));
  return drop.length;
}
async function processPhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const w = img.naturalWidth, h = img.naturalHeight;
    const blob = await drawToBlob(img, w, h, 1280, 0.75);
    const thumb = await drawToBlob(img, w, h, 360, 0.7);
    if (!blob) throw new Error('encode');
    return { blob, thumb };
  } finally { URL.revokeObjectURL(url); }
}
function photoBoxHTML(it){
  const { cur, prev, prevEnd, due } = photoPeriods(it);
  const mine = S.photos.filter(ph => ph.itemId === it.id).sort((a, b) => (a.at || 0) - (b.at || 0));
  const now = mine.filter(ph => ph.period >= cur), old = mine.filter(ph => ph.period >= prev && ph.period < cur);
  const thumb = (ph, canDel) => `<div class="ba-thumb"><button class="zoom" data-act="ph-zoom" data-pid="${esc(ph.id)}" aria-label="${SLOT_JP[ph.slot]}の写真を大きく表示"><img data-pid="${esc(ph.id)}" alt=""></button>
    ${canDel ? `<button class="x" data-act="ph-del" data-pid="${esc(ph.id)}" aria-label="この写真を消す">×</button>` : ''}</div>`;
  const col = (slot, list, editable) => `<div><div class="ba-lbl ${slot}">${SLOT_JP[slot]}<span class="tag">${slot === 'before' ? '掃除の前' : '掃除の後'}</span></div>
    <div class="ba-thumbs">${list.filter(ph => ph.slot === slot).map(ph => thumb(ph, editable)).join('')}
    ${editable && list.filter(ph => ph.slot === slot).length < PHOTO_MAX ? `<label class="ba-add"><b>＋</b>撮る・選ぶ<input type="file" accept="image/*" data-ph-slot="${slot}" data-id="${esc(it.id)}" multiple></label>` : ''}
    ${!editable && !list.some(ph => ph.slot === slot) ? '<p class="none">なし</p>' : ''}</div></div>`;
  return `<div id="photo-wrap"><section class="photo-box" aria-label="ビフォー・アフター写真">
    <h3>ビフォー・アフター写真</h3>
    <p class="sub">今回（${esc(fmtMD(cur))}〜${esc(fmtMD(due))}）の分。リセットされると、前回の分として1回だけ残り、その次のリセットで自動的に消えます。</p>
    <div class="ba-grid">${col('before', now, true)}${col('after', now, true)}</div>
    <details class="prev-photos"><summary>前回（${esc(fmtMD(prev))}〜${esc(fmtMD(prevEnd))}）の写真 ${old.length}枚</summary>
      ${old.length ? `<div class="ba-grid">${col('before', old, false)}${col('after', old, false)}</div>` : '<p class="none">前回の写真はありません</p>'}
    </details></section></div>`;
}
async function hydratePhotos(root){
  root.querySelectorAll('img[data-pid]').forEach(el => {
    const ph = S.photos.find(x => x.id === el.dataset.pid);
    if (ph) el.src = objURL(ph.id + ':pt', ph.thumb || ph.blob);
  });
}
function refreshPhotoBox(it, keepOpen){
  const box = $('#photo-wrap'); if (!box) return;
  const wasOpen = keepOpen ?? !!box.querySelector('details[open]');
  box.outerHTML = photoBoxHTML(it);
  const nb = $('#photo-wrap');
  if (wasOpen) nb.querySelector('details')?.setAttribute('open', '');
  hydratePhotos(nb);
}
async function onPhotoFiles(input){
  const it = S.items.find(x => x.id === input.dataset.id);
  const slot = input.dataset.phSlot;
  const files = [...(input.files || [])];
  input.value = '';
  if (!it || !files.length) return;
  if (memoryMode){ toast('おためし表示では写真を保存できません'); return; }
  const { cur } = photoPeriods(it);
  const room = PHOTO_MAX - S.photos.filter(ph => ph.itemId === it.id && ph.period >= cur && ph.slot === slot).length;
  const list = files.slice(0, Math.max(0, room));
  let saved = 0, failed = 0;
  for (let i = 0; i < list.length; i++){
    showBusy(list.length > 1 ? `写真を保存中（${i + 1}/${list.length}）` : '写真を保存中');
    try {
      const { blob, thumb } = await processPhoto(list[i]);
      const rec = { id: uid(), itemId: it.id, slot, period: cur, day: todayKey(), at: Date.now(), blob, thumb };
      await Store.put('photos', rec);
      S.photos.push(rec); saved++;
    } catch (e) {
      failed++;
      if (e && e.name === 'QuotaExceededError'){ hideBusy(); alertBox('iPadの空き容量が足りません', '写真を減らすか、空き容量を増やしてから、もう一度お試しください。'); break; }
    }
  }
  hideBusy();
  persist();
  refreshPhotoBox(it);
  if (files.length > list.length) toast(`${SLOT_JP[slot]}は${PHOTO_MAX}枚までです`);
  else if (failed) toast(`${failed}枚は保存できませんでした`);
  else if (saved) toast(slot === 'after' && status(it) !== 'ok' ? 'アフター写真を保存しました。完了日の記録も忘れずに' : `${SLOT_JP[slot]}の写真を保存しました`);
}
async function deletePhoto(pid){
  const ph = S.photos.find(x => x.id === pid); if (!ph) return;
  if (!await confirmBox('この写真を消しますか？', '元に戻せません。', '消す', true)) return;
  await Store.delete('photos', pid);
  S.photos = S.photos.filter(x => x.id !== pid);
  const it = S.items.find(x => x.id === ph.itemId);

  toast('写真を消しました');

      </div></li>`).join('');
  const hasHowto = infos.length || steps;
  app.innerHTML = `${topbar({ back: true, right, narrow: true })}<main class="wrap narrow">

        <h1 class="detail-title">${esc(it.title)}</h1></div>

      ${hasHowto ? `${infos.length ? `<div class="info-row ${infos.length === 1 ? 'one' : ''}">${infos.join('')}</div>` : ''}${steps ? `<ol class="steps">${steps}</ol>` : '<div style="height:18px"></div>'}`
        : `<div class="howto-empty"><b>やり方はまだ登録されていません</b>${S.editMode ? '右上の「この項目を編集」から、手順・写真・動画を登録できます。' : '右上の「編集」から、手順・写真・動画を登録できます。'}</div>`}

/* =========================================================
   項目の編集
   ========================================================= */
/* ---- 自動保存つきの編集 ----
   入力するたびに項目へ自動で保存する。編集を始めた時点の内容を「編集前の控え」として残し、
   「キャンセル」でそこへ戻せる。アプリが途中で閉じても、控えは残るので次に開いたとき選べる。 */
const SESSION_KEY = 'editSession';
function draftFromItem(it, isNew, id){
  const c = it ? JSON.parse(JSON.stringify(it)) : null;
  return {
    id: it ? it.id : (id || uid()), isNew,
    title: c?.title || '', p: c?.p ? c.p.slice() : (S.pf !== 'すべて' ? [S.pf] : []), freq: c?.freq || 'weekly',
    tools: c?.tools || '', caution: c?.caution || '',
    steps: c?.steps?.length ? c.steps.map(s => ({ id: s.id || uid(), text: s.text || '', media: s.media || [] })) : [],
    dirty: false, state: 'idle'
  };
}
function makeDraft(id){
  const base = id ? S.items.find(x => x.id === id) : null;
  if (id && !base) return null;
  const sess = S.editSession;
  if (sess && sess.id === (base ? base.id : null)) return draftFromItem(base, sess.isNew);
  if (!id && sess && sess.isNew){
    // 新しい項目の途中（保存済みならその項目から、まだならセッションのIDで）
    const saved = S.items.find(x => x.id === sess.id);
    return draftFromItem(saved, true, sess.id);
  }
  const d = draftFromItem(base, !base);
  S.editSession = { id: d.id, isNew: !base, snapshot: base ? JSON.parse(JSON.stringify(base)) : null, added: [], at: Date.now() };
  setSetting(SESSION_KEY, S.editSession).catch(() => {});
  return d;
}
function draftToItem(d, final){
  const current = S.items.find(x => x.id === d.id);
  const now = Date.now();
  let steps = d.steps.map(s => ({ id: s.id, text: final ? s.text.trim() : s.text, media: s.media }));
  if (final) steps = steps.filter(s => s.text || s.media.length);
  return {
    id: d.id, title: d.title.trim(), p: BASE_P.filter(l => d.p.includes(l)).concat(d.p.filter(l => !BASE_P.includes(l))), freq: d.freq,
    tools: final ? d.tools.trim() : d.tools, caution: final ? d.caution.trim() : d.caution, steps,
    done: current ? (current.done || []) : [], who: current ? (current.who || {}) : {}, memo: current ? current.memo : null,
    order: current ? current.order : nextOrder(),
    createdAt: current ? current.createdAt : now, updatedAt: now
  };
}
function paintAutosave(){
  const el = $('#as-state'); const d = S.draft; if (!el || !d) return;
  const map = { idle: ['', ''], saving: ['保存中…', ''], ok: ['✓ 自動保存済み', 'ok'], needTitle: ['項目名を入れると保存されます', 'warn'], err: ['保存できませんでした', 'warn'] };
  const [t, c] = map[d.state] || map.idle;
  el.textContent = t; el.className = 'as-state' + (c ? ' ' + c : '');
}
let autosaveTimer = null, autosaveBusy = Promise.resolve();
function queueAutosave(now){
  if (!S.draft) return;
  S.draft.dirty = true;
  clearTimeout(autosaveTimer);
  if (now) return autosave();
  autosaveTimer = setTimeout(autosave, 700);
}
function autosave(final){
  clearTimeout(autosaveTimer); autosaveTimer = null;
  const d = S.draft; if (!d) return autosaveBusy;
  autosaveBusy = autosaveBusy.then(async () => {
    if (S.draft !== d) return;
    if (!d.title.trim()){ d.state = 'needTitle'; paintAutosave(); return; }
    d.state = 'saving'; paintAutosave();
    try {
      const item = draftToItem(d, final);
      await Store.put('items', item);
      const i = S.items.findIndex(x => x.id === item.id);
      if (i >= 0) S.items[i] = item; else S.items.push(item);
      d.state = 'ok';
    } catch (e) {
      d.state = 'err';
      if (e && e.name === 'QuotaExceededError') toast('iPadの空き容量が足りません');
    }
    paintAutosave();
  });
  return autosaveBusy;
}
// 編集を終える：控えを捨てて、使われなくなった写真・動画を片付ける
async function commitSession(sess){
  if (!sess) return;
  const it = S.items.find(x => x.id === sess.id);
  const keep = new Set(it ? mediaIdsOf(it) : []);
  const cand = [...new Set([...(sess.added || []), ...(sess.snapshot ? mediaIdsOf(sess.snapshot) : [])])];
  const drop = cand.filter(id => !keep.has(id));
  try { await Store.deleteMany('media', drop); } catch (_) {}
  S.editSession = null; await setSetting(SESSION_KEY, null);
}
// 控えと比べて、何か変わっているか
function sessionChanged(sess){
  if (!sess) return false;
  const cur = S.items.find(x => x.id === sess.id);
  if (!sess.snapshot) return !!cur || (sess.added || []).length > 0;
  if (!cur) return true;
  const pick = it => JSON.stringify([it.title, it.p, it.freq, it.tools || '', it.caution || '', (it.steps || []).map(s => [s.text || '', (s.media || []).map(m => m.id)])]);
  return pick(cur) !== pick(sess.snapshot) || (sess.added || []).length > 0;
}
// 編集前に戻す
async function revertSession(sess){
  if (!sess) return;
  const cur = S.items.find(x => x.id === sess.id);
  if (sess.snapshot){
    const back = { ...JSON.parse(JSON.stringify(sess.snapshot)), done: cur ? cur.done : sess.snapshot.done, who: cur ? cur.who : sess.snapshot.who, memo: cur ? cur.memo : sess.snapshot.memo, updatedAt: Date.now() };
    await Store.put('items', back);
  } else if (cur){
    await Store.delete('items', cur.id);
  }
  const keep = new Set(sess.snapshot ? mediaIdsOf(sess.snapshot) : []);
  try { await Store.deleteMany('media', (sess.added || []).filter(id => !keep.has(id))); } catch (_) {}
  S.editSession = null; await setSetting(SESSION_KEY, null);
  await loadItems();
}

async function onFiles(input){
  const si = +input.dataset.si;
  const files = [...(input.files || [])];
  input.value = '';
  if (!files.length || !S.draft) return;
  const big = files.filter(f => f.size > 500 * 1024 * 1024);
  if (big.length && !await confirmBox('大きな動画があります', `${big.map(f => mb(f.size)).join('、')}の動画です。iPadの容量を使い、保存にも時間がかかります。このまま追加しますか？`, '追加する')) return;
  let failed = 0;
  for (let i = 0; i < files.length; i++){
    const f = files[i];
    showBusy(files.length > 1 ? `読み込み中（${i + 1}/${files.length}）` : '読み込み中');
    const isVideo = (f.type || '').startsWith('video/') || /\.(mov|mp4|m4v|webm)$/i.test(f.name);
    const isImage = (f.type || '').startsWith('image/') || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name);
    if (!isVideo && !isImage){ failed++; continue; }
    try {
      const rec = isVideo ? await processVideo(f) : await processImage(f);
      rec.id = uid(); rec.name = f.name || ''; rec.size = rec.blob.size;
      await Store.put('media', rec);
      if (S.editSession){ S.editSession.added.push(rec.id); await setSetting(SESSION_KEY, S.editSession); }
      S.draft.steps[si].media.push({ id: rec.id, kind: rec.kind });
      S.draft.dirty = true;
    } catch (e) { failed++; if (e && e.name === 'QuotaExceededError'){ hideBusy(); alertBox('iPadの空き容量が足りません', '動画を短くするか、古い写真・動画を減らしてください。'); break; } }
  }
  hideBusy();
  reEdit();
  queueAutosave(true);
  if (failed) toast(`${failed}件は読み込めませんでした（写真か動画を選んでください）`);
}

async function saveDraft(){
  const d = S.draft; if (!d) return;
  if (!d.title.trim()){ toast('項目名を入力してください'); $('#f-title')?.focus(); return; }
  showBusy('保存中');
  await autosave(true);
  if (d.state === 'err'){ hideBusy(); alertBox('保存できませんでした', 'もう一度「完了」を押してください。続くときは、写真や動画を減らして試してください。'); return; }
  await commitSession(S.editSession);
  persist();
  await loadItems();
  hideBusy();
  d.leaving = true; S.draft = null;
  location.replace('#/item/' + encodeURIComponent(d.id));
  toast('保存しました');
}
async function cancelEdit(){
  const d = S.draft;
  clearTimeout(autosaveTimer); if (d && d.dirty) await autosave();
  await autosaveBusy;
  const changed = sessionChanged(S.editSession);
  if (changed && !await confirmBox('編集前に戻しますか？', 'この編集で変えた内容（自動保存された分も）が、編集を始める前の状態に戻ります。', '編集前に戻す', true)) return;
  if (changed) await revertSession(S.editSession); else await commitSession(S.editSession);
  if (d) d.leaving = true;
  const exists = d && S.items.some(x => x.id === d.id);
  S.draft = null;
  location.replace(exists ? '#/item/' + encodeURIComponent(d.id) : '#/');
  if (changed) toast('編集前に戻しました');
}
async function deleteItem(){
  const d = S.draft;
  const it = d && S.items.find(x => x.id === d.id);
  if (!d || !it) return;
  const sess = S.editSession;
  const title = (sess && sess.snapshot && sess.snapshot.title) || it.title;
  if (!await confirmBox(`「${title}」を削除しますか？`, '完了日の記録・メモ・写真・動画も一緒に消えます。元に戻せません。', '削除する', true)) return;

  location.replace('#/');
  toast('削除しました');
}

async function sortMove(id, dir){
  const it = S.items.find(x => x.id === id);
  if (!it) return;
  const group = S.items.filter(x => freqOf(x) === freqOf(it));
  const i = group.indexOf(it), j = i + dir;
  if (j < 0 || j >= group.length) return;
  const a = S.items.indexOf(group[i]), b = S.items.indexOf(group[j]);
  const arr = S.items.slice();
  [arr[a], arr[b]] = [arr[b], arr[a]];
  arr.forEach((x, k) => x.order = k + 1);
  await Store.putMany('items', arr);
  S.items = arr;
  keepScroll(renderSort);
}

async function makeIconData(file, mode){
  const src = URL.createObjectURL(file);
  try {
    const img = await loadImg(src);
    const out = size => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, size, size);
      const w = img.naturalWidth, h = img.naturalHeight;
      if (mode === 'fit'){
        const pad = size * 0.1, box = size - pad * 2, r = Math.min(box / w, box / h);
        g.drawImage(img, (size - w * r) / 2, (size - h * r) / 2, w * r, h * r);
      } else {
        const sq = Math.min(w, h);
        g.drawImage(img, (w - sq) / 2, (h - sq) / 2, sq, sq, 0, 0, size, size);
      }
      return c.toDataURL('image/png');
    };
    return { d180: out(180) };
  } finally { URL.revokeObjectURL(src); }
}
function openIconPicker(file){

  });
  overlay.appendChild(el);

/* ---------- バックアップ ---------- */
const ymd = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; };
function downloadFile(f){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(f); a.download = f.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function makeBackup(){
  showBusy('バックアップを作成中');
  try {
    const items = await Store.getAll('items');
    const media = await Store.getAll('media');
    const parts = [], meta = []; let off = 0;
    for (const m of media){
      const e = { id: m.id, kind: m.kind, mime: m.mime, name: m.name || '', size: m.size || m.blob.size };
      e.b = [off, m.blob.size, m.blob.type || m.mime || '']; parts.push(m.blob); off += m.blob.size;
      if (m.thumb){ e.t = [off, m.thumb.size, m.thumb.type || 'image/jpeg']; parts.push(m.thumb); off += m.thumb.size; }
      meta.push(e);
    }
    const helpMeta = [];
    for (const h of S.help){
      const e = { id: h.id, title: h.title || '', mime: h.mime, order: h.order ?? 0 };
      e.b = [off, h.blob.size, h.blob.type || h.mime || '']; parts.push(h.blob); off += h.blob.size;
      if (h.thumb){ e.t = [off, h.thumb.size, h.thumb.type || 'image/jpeg']; parts.push(h.thumb); off += h.thumb.size; }
      helpMeta.push(e);
    }
    const header = new TextEncoder().encode(JSON.stringify({ format: 'seisou-check-backup', v: 6, exportedAt: new Date().toISOString(),
      settings: { title: S.title, staff: S.staff, reset: S.reset, ui: S.ui, icon: S.icon, iconName: S.iconName }, items, media: meta, help: helpMeta }));
    S.backup = new File([MAGIC, String(header.length).padStart(12, '0'), header, ...parts],
      `seisou-backup-${ymd()}.seisou`, { type: 'application/octet-stream' });
    hideBusy();
    await renderSettings();
    $('[data-act="share-backup"]')?.focus();
  } catch (_) { hideBusy(); alertBox('バックアップを作成できませんでした', 'もう一度お試しください。'); }
}
async function markBackup(){ S.lastBackup = todayKey(); await setSetting('lastBackup', S.lastBackup); }
function shareBackup(){
  const f = S.backup;
  if (!f) return;
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch (_) {}
  const ok = () => { markBackup().then(() => keepScroll(renderSettings)); toast('バックアップを保存しました'); };
  if (canShare) navigator.share({ files: [f] }).then(ok).catch(err => { if (err && err.name !== 'AbortError'){ downloadFile(f); ok(); } });
  else { downloadFile(f); ok(); }
}
function readAB(blob){
  if (blob.arrayBuffer) return blob.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(blob); });
}
async function onRestore(input){
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  if (!await confirmBox('バックアップから復元しますか？', '今入っている項目・記録・メモ・写真・動画はすべて置き換わります。', '復元する', true)) return;
  showBusy('復元中');
  try {
    const head = new TextDecoder().decode(await readAB(f.slice(0, 20)));
    if (head.slice(0, 8) !== MAGIC) throw new Error('format');
    const len = parseInt(head.slice(8, 20), 10);
    if (!(len > 0)) throw new Error('format');
    const h = JSON.parse(new TextDecoder().decode(await readAB(f.slice(20, 20 + len))));
    if (h.format !== 'seisou-check-backup' || !Array.isArray(h.items)) throw new Error('format');
    const ds = 20 + len;
    const media = (h.media || []).map(e => ({
      id: e.id, kind: e.kind, mime: e.mime, name: e.name, size: e.size,
      blob: new Blob([f.slice(ds + e.b[0], ds + e.b[0] + e.b[1])], { type: e.b[2] || e.mime }),
      thumb: e.t ? new Blob([f.slice(ds + e.t[0], ds + e.t[0] + e.t[1])], { type: e.t[2] }) : null
    }));
    const help = (h.help || []).map(e => ({
      id: e.id, title: e.title || '', mime: e.mime, order: e.order ?? 0,
      blob: new Blob([f.slice(ds + e.b[0], ds + e.b[0] + e.b[1])], { type: e.b[2] || e.mime }),
      thumb: e.t ? new Blob([f.slice(ds + e.t[0], ds + e.t[0] + e.t[1])], { type: e.t[2] }) : null,
      createdAt: Date.now()
    }));
    await Store.replaceAll(h.items, media, help);
    const st = h.settings || (h.title ? { title: h.title } : {});
    if (st.title){ S.title = st.title; await setSetting('title', st.title); document.title = st.title; }
    if (Array.isArray(st.staff)){ S.staff = st.staff; await setSetting('staff', st.staff); }
    if (st.reset){ S.reset = { ...DEFAULT_RESET, ...st.reset }; await setSetting('reset', S.reset); }
    if (st.ui){ S.ui = { ...DEFAULT_UI, ...st.ui }; await setSetting('ui', S.ui); applyUI(); }
    if ('icon' in st){ S.icon = st.icon || null; await setSetting('icon', S.icon); }
    if ('iconName' in st){ S.iconName = st.iconName || null; await setSetting('iconName', S.iconName); }
    applyIcon();
    await loadItems();
    S.help = await Store.getAll('help');
    S.help.sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.createdAt ?? 0) - (b.createdAt ?? 0));
    await prunePhotos();
    S.backup = null; S.pf = 'すべて'; S.todoOnly = false;
    hideBusy();
    location.replace('#/');
    toast('復元しました');
  } catch (e) {
    hideBusy();
    if (e && e.name === 'QuotaExceededError') alertBox('iPadの空き容量が足りません', '空きを増やしてから、もう一度お試しください。');
    else alertBox('このファイルは読み込めませんでした', 'このアプリで作ったバックアップファイル（.seisou）を選んでください。');
  }
}

  },
  'step-up': t => moveStep(+t.dataset.si, -1),
  'step-down': t => moveStep(+t.dataset.si, 1),
  'step-del': async t => {
    const i = +t.dataset.si, s = S.draft.steps[i];
    if ((s.text.trim() || s.media.length) && !await confirmBox(`ステップ${i + 1}を削除しますか？`, '「キャンセル」を押せば、編集前の状態に戻せます。', '削除する', true)) return;
    S.draft.steps.splice(i, 1); reEdit(); queueAutosave(true);
  },
  'media-del': t => { S.draft.steps[+t.dataset.si].media.splice(+t.dataset.mi, 1); reEdit(); queueAutosave(true); },
  'save': saveDraft,
  'cancel-edit': cancelEdit,
  'delete-item': deleteItem,
  'save-title': async () => {
    const v = ($('#app-name')?.value || '').trim() || DEFAULT_TITLE;
    S.title = v; document.title = v; await setSetting('title', v); toast('名前を保存しました');
  },
  'change-pin': changePin,
  'make-backup': makeBackup,
  'icon-reset': async () => {
    if (!await confirmBox('元のアイコンに戻しますか？', '', '戻す')) return;
    S.icon = null; await setSetting('icon', null); applyIcon(); keepScroll(renderSettings); toast('元のアイコンに戻しました');
  },
  'save-icon-name': async () => {
    const v = ($('#icon-name').value || '').trim() || '掃除チェック';
    S.iconName = v; await setSetting('iconName', v); applyIcon(); keepScroll(renderSettings); toast('名前を保存しました');
  },
  'share-backup': shareBackup,
  'rs-wd': t => saveReset({ weekday: +t.dataset.v }),
  'rs-bi': t => saveReset({ biweekly: t.dataset.v.split(',').map(Number) }),
  'rs-mo': t => saveReset({ monthly: +t.dataset.v }),
  'rs-mode': t => { const [freq, mode] = t.dataset.v.split(':'); saveResetMode(freq, mode); },
  'rs-date': t => toggleResetDate(t.dataset.freq, +t.dataset.v),
  'staff-list': openStaffList,
  'ui-theme': t => saveUI({ theme: t.dataset.v }, '背景を変えました'),
  'ui-accent': t => saveUI({ accent: t.dataset.v }, '色を変えました'),
  'ui-zoom': t => saveUI({ zoom: +t.dataset.v }, '文字の大きさを変えました'),
  'ui-col': t => saveUI({ [t.dataset.v]: !S.ui[t.dataset.v] }),
  'ui-labels-save': () => {
    const labels = {};
    app.querySelectorAll('[data-label]').forEach(i => { const v = i.value.trim(); if (v && v !== LABEL_DEFAULT[i.dataset.label]) labels[i.dataset.label] = v; });
    saveUI({ labels }, '言葉を保存しました');
  },
  'ui-labels-reset': async () => {
    if (!await confirmBox('言葉をすべて元に戻しますか？', '書き換えた言葉が、最初の言葉に戻ります。', '元に戻す', true)) return;
    saveUI({ labels: {} }, '元に戻しました');
  }
};

app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && !t.disabled){ const fn = actions[t.dataset.act]; if (fn) fn(t, e); }
  const h = e.target.closest('[data-hact]');
  if (h && !h.disabled){
    const id = h.dataset.id, m = h.dataset.hact;
    if (m === 'del') deleteHelpVideo(id);
    else if (m === 'up') moveHelpVideo(id, -1);
    else if (m === 'down') moveHelpVideo(id, 1);
  }
});
const helpTitleTimers = {};
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.hact === 'title'){
    const id = t.dataset.id, v = t.value;
    clearTimeout(helpTitleTimers[id]);
    helpTitleTimers[id] = setTimeout(() => saveHelpTitle(id, v), 400);
    return;
  }
  if (!S.draft || !t.dataset.f) return;
  if (t.dataset.f === 'step-text') S.draft.steps[+t.dataset.si].text = t.value;
  else S.draft[t.dataset.f] = t.value;
  queueAutosave();
});
app.addEventListener('change', e => {
  if (e.target.id === 'ui-color') saveUI({ accent: e.target.value }, '色を変えました');
  else if (e.target.matches('.file-input')) onFiles(e.target);
  else if (e.target.id === 'restore-input') onRestore(e.target);
  else if (e.target.id === 'icon-input') onIconFile(e.target);
  else if (e.target.id === 'help-file-input') onHelpFiles(e.target);
  else if (e.target.matches('[data-ph-slot]')) onPhotoFiles(e.target);
});
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { S.lastActive = Date.now(); }, { passive: true }));
setInterval(() => {
  if ((S.editMode || S.settingsOpen || S.helpEditOpen) && !S.draft && Date.now() - S.lastActive > AUTO_LOCK_MS && !overlay.querySelector('.modal-bg')) lockAll(true);
}, 30000);
// 日付が変わったら（リセット日をまたいだら）画面を更新
let shownDay = todayKey();
const checkDay = async () => {
  if (todayKey() === shownDay) return;
  shownDay = todayKey();
  await prunePhotos();
  if (!S.draft && !overlay.querySelector('.modal-bg')) rerenderKeepScroll();
};
setInterval(checkDay, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkDay(); else if (S.draft && autosaveTimer) autosave(); });
window.addEventListener('pagehide', () => { if (S.draft && autosaveTimer) autosave(); });
window.addEventListener('hashchange', onHash);

/* =========================================================
   起動
   ========================================================= */
async function init(){
  try { db = await withTimeout(openDB(), 3000); } catch (_) { memoryMode = true; }
  try {
    S.title = await getSetting('title', DEFAULT_TITLE);
    S.pinHash = await getSetting('pin', null);
    S.staff = await getSetting('staff', []);
    S.reset = { ...DEFAULT_RESET, ...(await getSetting('reset', {})) };
    S.lastBackup = await getSetting('lastBackup', null);
    S.ui = { ...DEFAULT_UI, ...(await getSetting('ui', {})) };
    S.icon = await getSetting('icon', null);
    S.iconName = await getSetting('iconName', null);
    S.editSession = await getSetting(SESSION_KEY, null);
    S.help = await Store.getAll('help');
    S.help.sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.createdAt ?? 0) - (b.createdAt ?? 0));
    if (!await getSetting('seeded', false)){
      const existing = await Store.getAll('items');
      if (!existing.length) await Store.putMany('items', initialItems());
      await setSetting('seeded', true);
    }
    await loadItems();
    await loadPhotos();
    await prunePhotos();
  } catch (_) {
    memoryMode = true; db = null;
    if (!mem.items.size) initialItems().forEach(i => mem.items.set(i.id, i));
    await loadItems();
  }
  document.title = S.title;
  applyUI();
  applyIcon();
  lastHash = location.hash;
  persist();
  render();
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && secure && !memoryMode) setupUpdates();
}
// 新しい版を置いたら、次に開いたとき（画面に戻ったとき）に自動で切り替える
function setupUpdates(){
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    if (S.draft || overlay.querySelector('.modal-bg')){ toast('新しい版があります。編集を終えてから開き直してください'); return; }
    reloading = true; location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); };
    document.addEventListener('visibilitychange', check);
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
}
init();
})();

</script>
